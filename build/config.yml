# Project configuration for Wails v3.
# After changing `info` or `fileAssociations`, regenerate the platform assets with:
#   wails3 task common:update:build-assets
# (this overwrites build/darwin/Info*.plist — re-add NSMicrophoneUsageDescription afterwards).
version: '3'

info:
  companyName: "devalexandre"
  productName: "Llamafile UI"
  productIdentifier: "io.github.devalexandre.llamafileui"
  description: "Chat, imagens, voz e documentos com IA local usando llamafile"
  copyright: "© 2026 devalexandre"
  comments: "Interface desktop para o llamafile da Mozilla AI"
  version: "0.2.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - docs
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

fileAssociations:

other:
