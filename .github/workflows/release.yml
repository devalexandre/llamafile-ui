name: Build & Release

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WAILS_VERSION: v3.0.0-beta.30
  NODE_VERSION: "22"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=0.2.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Linux deps (GTK4 + WebKitGTK 6)
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Placeholder frontend (go:embed)
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
          - name: windows-amd64
            os: windows-latest
          - name: macos-universal
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The wails3 CLI itself links GTK4/WebKitGTK on Linux, so deps come first.
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libfuse2

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Stamp version
        shell: bash
        run: |
          for f in build/config.yml build/linux/nfpm/nfpm.yaml build/darwin/Info.plist build/darwin/Info.dev.plist \
                   build/windows/info.json build/windows/nsis/wails_tools.nsh build/windows/wails.exe.manifest; do
            [ -f "$f" ] && sed -i.bak "s/0\.2\.0/${VERSION}/g" "$f" && rm -f "$f.bak"
          done

      # ---------------------------------------------------------------- Linux
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          wails3 task linux:create:deb
          wails3 task linux:create:rpm
          wails3 task linux:create:aur
          mkdir -p dist
          cp bin/llamafile-ui.deb "dist/llamafile-ui_${VERSION}_amd64.deb"
          cp bin/llamafile-ui.rpm "dist/llamafile-ui-${VERSION}-1.x86_64.rpm"
          cp bin/llamafile-ui.pkg.tar.zst "dist/llamafile-ui-${VERSION}-1-x86_64.pkg.tar.zst"
          tar -C bin -czf "dist/llamafile-ui-${VERSION}-linux-amd64.tar.gz" llamafile-ui

      - name: AppImage (Linux, optional)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          wails3 task linux:create:appimage
          f=$(ls bin/*.AppImage 2>/dev/null | head -1)
          [ -n "$f" ] && cp "$f" "dist/llamafile-ui-${VERSION}-x86_64.AppImage"

      # -------------------------------------------------------------- Windows
      - name: NSIS + gcc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
          # The microphone recorder (malgo/miniaudio) needs cgo.
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) { choco install mingw -y --no-progress }
          "CGO_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          wails3 task windows:package
          mkdir -p dist
          cp bin/llamafile-ui.exe "dist/llamafile-ui-${VERSION}-windows-amd64.exe"
          cp bin/llamafile-ui-amd64-installer.exe "dist/llamafile-ui-${VERSION}-windows-amd64-setup.exe"

      # ---------------------------------------------------------------- macOS
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          wails3 task darwin:package:universal
          mkdir -p dist
          rm -rf "dist/Llamafile UI.app"
          cp -R bin/llamafile-ui.app "dist/Llamafile UI.app"
          ditto -c -k --keepParent "dist/Llamafile UI.app" "dist/llamafile-ui-${VERSION}-macos-universal.zip"
          rm -rf "dist/Llamafile UI.app"

      - uses: actions/upload-artifact@v4
        with:
          name: llamafile-ui-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # whisper.cpp with GPU (Vulkan / Metal). Upstream publishes no Linux binaries
  # and llamafile's whisperfile is CPU-only; the app downloads these packages
  # from its own release (Settings → Tools). Failures do not block the release.
  whisper-gpu:
    needs: [version]
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04 # older glibc: runs on more distributions
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      WHISPER_CPP: v1.9.5
    steps:
      - uses: actions/cache@v4
        id: cache
        with:
          path: whisper-gpu-${{ matrix.name }}.zip
          key: whisper-gpu-${{ matrix.name }}-v1.9.5-1

      - name: Vulkan SDK
        if: steps.cache.outputs.cache-hit != 'true' && matrix.name != 'macos-arm64'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          cache: true
          stripdown: true

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch "$WHISPER_CPP" https://github.com/ggml-org/whisper.cpp.git src
          common="-DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF"
          case "${{ matrix.name }}" in
            linux-x64)
              cmake -S src -B build $common -DGGML_VULKAN=ON -DGGML_OPENMP=OFF \
                -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc" ;;
            windows-x64)
              # The stripped-down Vulkan SDK lacks SPIRV-Headers' CMake package.
              git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git spv-src
              cmake -S spv-src -B spv-build -DSPIRV_HEADERS_ENABLE_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/spv"
              cmake --install spv-build
              spv="$(cygpath -m "$PWD/spv")"
              cmake -S src -B build $common -DGGML_VULKAN=ON -DCMAKE_PREFIX_PATH="$spv" \
                -DCMAKE_CXX_FLAGS="-I$spv/include" -DCMAKE_C_FLAGS="-I$spv/include" ;;
            macos-arm64)
              cmake -S src -B build $common -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DCMAKE_OSX_ARCHITECTURES=arm64 ;;
          esac
          cmake --build build --config Release --target whisper-cli -j 4
          mkdir pkg
          find build -type f \( -name 'whisper-cli' -o -name 'whisper-cli.exe' \) -exec cp {} pkg/ \;
          cp src/LICENSE pkg/LICENSE-whisper.cpp
          echo "$WHISPER_CPP" > pkg/VERSION
          ls -la pkg

      - name: Package
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "whisper-gpu-${{ matrix.name }}.zip" ./pkg/*
          else
            (cd pkg && zip -9 "../whisper-gpu-${{ matrix.name }}.zip" *)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: whisper-gpu-${{ matrix.name }}
          path: whisper-gpu-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    needs: [version, build, whisper-gpu]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Llamafile UI v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/*
